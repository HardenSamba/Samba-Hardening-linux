# --- Role : controleur de domaine Samba AD --------------------------------
#
# Ce profil remplace deux reglages du profil generique qui entrent en conflit
# avec le fonctionnement d'un DC Active Directory.

# CONFLIT 1 - Plage de ports ephemeres.
# Samba alloue ses services RPC dynamiques dans la plage 49152-65535. Si la
# plage ephemere du noyau la recouvre, le noyau peut attribuer a une connexion
# sortante un port que Samba cherchera ensuite a reserver, ce qui provoque des
# echecs RPC intermittents et difficiles a diagnostiquer.
# On borne donc la plage ephemere en dessous de 49152.
# ARBITRAGE : ce reglage fait echouer le point R12 du script de diagnostic,
# qui attend strictement "32768 65535". Le fonctionnement de Samba est ici
# prefere a la conformite formelle. Decision a faire valider.
net.ipv4.ip_local_port_range = 32768 49151

# CONFLIT 2 - Durcissement ARP.
# arp_ignore=2 et arp_filter=1 perturbent la resolution ARP sur les machines
# multi-interfaces et lors des bascules d'adresse. Un DC doit rester joignable
# de maniere deterministe : on conserve le comportement par defaut.
net.ipv4.conf.all.arp_filter = 0
net.ipv4.conf.all.arp_ignore = 0
net.ipv4.conf.all.drop_gratuitous_arp = 0
