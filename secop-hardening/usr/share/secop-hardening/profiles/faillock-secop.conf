# --- ANSSI BP-028 R67 : blocage apres echecs d'authentification -----------
# Depose dans /etc/security/faillock.conf.
#
# Deux choix de securite importants :
#   - unlock_time est fixe, donc un blocage se leve tout seul. Sans cela,
#     une erreur de frappe repetee condamne le compte jusqu'a intervention
#     manuelle en console.
#   - even_deny_root n'est PAS active : le compte root reste utilisable en
#     console quoi qu'il arrive. C'est le dernier filet de securite.

# Nombre d'echecs tolere avant blocage.
deny = 5

# Fenetre pendant laquelle les echecs sont comptes, en secondes.
fail_interval = 900

# Duree du blocage, en secondes. 900 = 15 minutes.
unlock_time = 900

# Journalisation des refus.
audit

# Repertoire des compteurs d'echec.
dir = /var/run/faillock
