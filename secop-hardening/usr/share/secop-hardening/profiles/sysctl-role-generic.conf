# --- Role : serveur generique ---------------------------------------------

# Durcissement ARP : ne repond qu'aux requetes destinees a l'interface locale.
# Non applique au role samba-ad-dc (voir sysctl-role-samba-ad-dc.conf).
net.ipv4.conf.all.arp_filter = 1
net.ipv4.conf.all.arp_ignore = 2
net.ipv4.conf.all.drop_gratuitous_arp = 1

# Plage de ports ephemeres
net.ipv4.ip_local_port_range = 32768 65535
