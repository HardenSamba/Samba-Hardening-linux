# --- ANSSI BP-028 R73 : regles de journalisation auditd --------------------
# Depose dans /etc/audit/rules.d/, charge par augenrules.

# Repartir d'un jeu de regles vierge a chaque chargement.
-D

# Taille du tampon. A augmenter sur une machine tres active.
-b 8192

# Comportement en cas de saturation : 1 = journalisation d'une alerte.
-f 1

# --- Modifications des comptes et des groupes ---
-w /etc/passwd -p wa -k identite
-w /etc/group -p wa -k identite
-w /etc/shadow -p wa -k identite
-w /etc/gshadow -p wa -k identite
-w /etc/sudoers -p wa -k elevation
-w /etc/sudoers.d/ -p wa -k elevation

# --- Authentification et sessions ---
-w /var/log/lastlog -p wa -k sessions
-w /var/run/faillock/ -p wa -k sessions
-w /etc/pam.d/ -p wa -k authentification
-w /etc/security/ -p wa -k authentification

# --- Configuration systeme sensible ---
-w /etc/ssh/sshd_config -p wa -k configuration
-w /etc/ssh/sshd_config.d/ -p wa -k configuration
-w /etc/sysctl.conf -p wa -k configuration
-w /etc/sysctl.d/ -p wa -k configuration
-w /etc/modprobe.d/ -p wa -k configuration
-w /etc/crontab -p wa -k planification
-w /etc/cron.d/ -p wa -k planification

# --- Chargement et dechargement de modules noyau ---
-w /sbin/insmod -p x -k modules
-w /sbin/rmmod -p x -k modules
-w /sbin/modprobe -p x -k modules
-a always,exit -F arch=b64 -S init_module,delete_module -k modules

# --- Modifications de droits et de proprietaire ---
-a always,exit -F arch=b64 -S chmod,fchmod,fchmodat -F auid>=1000 -F auid!=-1 -k permissions
-a always,exit -F arch=b64 -S chown,fchown,lchown,fchownat -F auid>=1000 -F auid!=-1 -k permissions

# --- Echecs d'acces aux fichiers ---
-a always,exit -F arch=b64 -S open,openat -F exit=-EACCES -F auid>=1000 -F auid!=-1 -k acces_refuse
-a always,exit -F arch=b64 -S open,openat -F exit=-EPERM -F auid>=1000 -F auid!=-1 -k acces_refuse

# --- Modification de l'heure systeme (critique pour Kerberos) ---
-a always,exit -F arch=b64 -S adjtimex,settimeofday,clock_settime -k horloge
-w /etc/localtime -p wa -k horloge

# NOTE - La surveillance des appels execve n'est volontairement PAS activee.
# Sur un controleur de domaine, elle genere un volume de journaux tres
# important. A envisager seulement avec /var/log/audit sur sa propre
# partition et une politique de rotation adaptee.
