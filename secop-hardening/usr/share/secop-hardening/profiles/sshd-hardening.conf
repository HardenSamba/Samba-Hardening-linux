# --- ANSSI BP-028 R79 : durcissement du service SSH ------------------------
#
# Depose en drop-in dans /etc/ssh/sshd_config.d/ : le fichier sshd_config
# appartient au paquet openssh-server et n'est jamais modifie.
#
# Rappel : sous OpenSSH, c'est la PREMIERE occurrence d'une directive qui
# l'emporte. La ligne Include figure en tete de sshd_config sur Debian, donc
# ces valeurs priment bien sur les valeurs par defaut du fichier principal.

LogLevel VERBOSE
Banner /etc/issue.net

PermitRootLogin no
MaxAuthTries 3
MaxStartups 10:30:60
PermitEmptyPasswords no
IgnoreRhosts yes
HostbasedAuthentication no
PermitUserEnvironment no
KbdInteractiveAuthentication no
UsePAM yes

LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 0

StrictModes yes
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
AllowStreamLocalForwarding no
GatewayPorts no
PermitTunnel no
DisableForwarding yes
Compression no
PrintMotd no

Ciphers aes256-gcm@openssh.com,aes256-ctr,aes128-gcm@openssh.com,aes128-ctr
MACs -hmac-md5*,hmac-sha1*,umac-64*,hmac-ripemd160*
KexAlgorithms -diffie-hellman-group1-sha1,diffie-hellman-group14-sha1,diffie-hellman-group-exchange-sha1

# NOTE : GSSAPIAuthentication est volontairement laisse a sa valeur par defaut.
# Le referentiel d'origine le force a "no", ce qui supprime l'authentification
# SSH par ticket Kerberos - fonctionnalite generalement attendue dans un
# environnement Active Directory. A trancher selon le besoin.
