# --- ANSSI BP-028 R39, R40 : directives sudo -------------------------------
# Une directive par ligne. Chacune est testee individuellement par visudo et
# n'est retenue que si l'implementation de sudo presente la comprend.
#
# Ubuntu 26.04 livre sudo-rs, une reimplementation en Rust qui ne supporte
# pas toutes les directives du sudo traditionnel. "logfile" notamment est
# absente : sudo-rs journalise vers syslog uniquement.

Defaults secure_path="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
Defaults env_reset
Defaults umask=0077
Defaults use_pty
Defaults ignore_dot
Defaults !visiblepw
Defaults tty_tickets
Defaults timestamp_timeout=5
Defaults passwd_timeout=1
Defaults logfile="/var/log/sudo.log"
