# --- ANSSI BP-028 R13 : desactivation de la pile IPv6 ----------------------
#
# ATTENTION sur un controleur de domaine : verifier au prealable qu'aucun
# enregistrement DNS AAAA ni aucun client ne depend d'IPv6.
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1
net.ipv6.conf.lo.disable_ipv6 = 1
