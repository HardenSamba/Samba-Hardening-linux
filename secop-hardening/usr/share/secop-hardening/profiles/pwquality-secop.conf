# --- ANSSI BP-028 R31 : robustesse des mots de passe ----------------------
# Depose dans /etc/security/pwquality.conf.d/ : le fichier pwquality.conf
# d'origine n'est jamais modifie.
#
# IMPORTANT sur un controleur de domaine : ces regles ne s'appliquent qu'aux
# comptes LOCAUX de la machine. La politique du domaine est geree par Samba
# (samba-tool domain passwordsettings) et n'est pas concernee.

# Longueur minimale.
minlen = 12

# Nombre minimal de classes de caracteres (minuscules, majuscules, chiffres,
# caracteres speciaux).
minclass = 3

# Nombre maximal de caracteres identiques consecutifs.
maxrepeat = 3

# Interdit un mot de passe contenant le nom d'utilisateur.
usercheck = 1

# Interdit les suites de caracteres du clavier et de l'alphabet.
maxsequence = 4

# Les regles s'appliquent aussi a root.
enforce_for_root

# Nombre de tentatives avant abandon.
retry = 3
