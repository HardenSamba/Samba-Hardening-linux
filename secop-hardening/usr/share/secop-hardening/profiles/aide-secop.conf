# --- ANSSI BP-028 R76, R77 : exclusions de scellement ----------------------
# Depose dans /etc/aide/aide.conf.d/. Complete la configuration Debian
# d'origine sans la remplacer.

# --- Repertoires par nature changeants ---
!/var/log
!/var/cache
!/var/spool
!/var/tmp
!/var/lib/aide
!/var/lib/systemd
!/var/lib/dpkg
!/var/lib/apt
!/var/lib/secop-hardening
!/tmp
!/proc
!/sys
!/dev
!/run

# --- Samba Active Directory ---
# Les bases de l'annuaire et le partage sysvol changent en permanence sur un
# controleur de domaine. Sans ces exclusions, le rapport quotidien devient
# illisible et donc inutile.
!/var/lib/samba
!/var/cache/samba
!/var/run/samba

# --- Elements a surveiller en priorite ---
/etc            p+i+n+u+g+s+m+c+md5+sha256
/bin            p+i+n+u+g+s+m+c+md5+sha256
/sbin           p+i+n+u+g+s+m+c+md5+sha256
/usr/bin        p+i+n+u+g+s+m+c+md5+sha256
/usr/sbin       p+i+n+u+g+s+m+c+md5+sha256
/boot           p+i+n+u+g+s+m+c+md5+sha256
