# /etc/secop/hardening.conf
# Configuration du paquet secop-hardening (durcissement ANSSI BP-028).
#
# Ce fichier est lu par /usr/sbin/secop-harden a chaque application.
# Apres toute modification : secop-harden apply
#
# ---------------------------------------------------------------------------
# PROFIL : niveau de durcissement applique
#   minimal       = recommandations ANSSI de niveau minimal uniquement
#   intermediaire = minimal + niveau intermediaire (defaut)
# ---------------------------------------------------------------------------
SECOP_PROFILE="intermediaire"

# ---------------------------------------------------------------------------
# ROLE : adapte le socle au service porte par la machine
#   generic      = serveur sans role particulier
#   samba-ad-dc  = controleur de domaine Samba Active Directory
#
# Le role samba-ad-dc reduit la plage de ports ephemeres pour ne pas empieter
# sur la plage RPC dynamique de Samba (49152-65535) et laisse IPv6 actif.
# ---------------------------------------------------------------------------
SECOP_ROLE="samba-ad-dc"

# ---------------------------------------------------------------------------
# MODULES : activation individuelle des blocs de durcissement
# ---------------------------------------------------------------------------

# Parametres noyau (sysctl) - ANSSI R9 a R14
SECOP_SYSCTL="yes"

# Blocage de modules noyau (protocoles exotiques, USB, Firewire) - ANSSI R58
SECOP_MODPROBE="yes"

# Durcissement du service SSH - ANSSI R79
# ATTENTION : verifier l'acces console avant d'activer sur une machine distante.
SECOP_SSHD="no"

# ---------------------------------------------------------------------------
# OPTIONS FINES
# ---------------------------------------------------------------------------

# Desactivation complete de la pile IPv6 (ANSSI R13).
# Ignoree lorsque SECOP_ROLE vaut samba-ad-dc, sauf si forcee ici a "yes".
SECOP_DISABLE_IPV6="no"

# Blocage du stockage USB et du Thunderbolt (ANSSI R58).
# A passer a "no" sur une machine administree physiquement par cle USB.
SECOP_DISABLE_USB="yes"

# ---------------------------------------------------------------------------
# LOT PERMISSIONS ET DURCISSEMENT SYSTEME (version 0.2.0)
# ---------------------------------------------------------------------------

# Permissions des fichiers sensibles - ANSSI R6, R29, R50
# L'etat initial est sauvegarde : "secop-harden revert" le restaure.
SECOP_PERMISSIONS="yes"

# Directives sudo et restriction du binaire - ANSSI R38, R39, R40
SECOP_SUDO="yes"

# umask par defaut a 0027 - ANSSI R36
SECOP_UMASK="yes"

# Expiration des sessions inactives - ANSSI R32
SECOP_TMOUT="yes"

# Retrait des capacites etendues des binaires - ANSSI R63
# Desactive par defaut : peut casser des services qui en dependent
# (capture reseau, synchronisation PTP, liaison sur port privilegie).
SECOP_CAPABILITIES="no"

# ---------------------------------------------------------------------------
# REGLAGES FINS DU LOT
# ---------------------------------------------------------------------------

# Delai d'inactivite avant deconnexion, en secondes (600 = 10 minutes).
SECOP_TMOUT_SECONDS="600"

# Groupe autorise a utiliser sudo (ANSSI R38). Le binaire /usr/bin/sudo passe
# en 4750 root:<groupe>. La mesure est ignoree si le groupe est vide, afin de
# ne jamais couper l'acces administrateur.
SECOP_SUDO_GROUP="sudo"

# Mode strict sudo (ANSSI R39) : active les directives "noexec" et
# "requiretty", necessaires pour que le point R39 passe au vert.
#
# ATTENTION - Ces directives ont des effets de bord importants :
#   - noexec empeche un programme lance par sudo d'en executer un autre.
#     Une clause EXEC est ajoutee pour le groupe administrateur afin que
#     "sudo bash script.sh" continue de fonctionner, mais tout autre
#     utilisateur ou regle sudo devra etre adapte.
#   - requiretty interdit toute execution non interactive de sudo, ce qui
#     casse cron, Ansible et les scripts d'automatisation.
#
# A n'activer qu'apres avoir verifie que rien ne depend de ces mecanismes.
SECOP_SUDO_STRICT="no"

# ---------------------------------------------------------------------------
# LOT JOURNALISATION ET INTEGRITE (version 0.3.0)
#
# Ces trois mesures dependent de logiciels tiers. Le paquet ne les installe
# pas : il les configure s'ils sont presents, et le signale sinon.
#   apt install auditd aide rsyslog
# ---------------------------------------------------------------------------

# Regles de journalisation auditd - ANSSI R73
SECOP_AUDITD="yes"

# Scellement des fichiers avec AIDE - ANSSI R76 et R77
# Depose les exclusions et active une verification quotidienne. La base de
# reference doit ensuite etre construite par : secop-harden aide-init
SECOP_AIDE="yes"

# Export des journaux vers un serveur distant - ANSSI R71
# Desactive par defaut car il faut un serveur de journalisation joignable.
# Le point R71 ne peut pas passer au vert sans cet export : un journal
# uniquement local peut etre efface par un attaquant ayant obtenu root.
SECOP_RSYSLOG_REMOTE="no"
SECOP_RSYSLOG_HOST=""
SECOP_RSYSLOG_PORT="514"

# ---------------------------------------------------------------------------
# LOT PARAMETRES DE DEMARRAGE (version 0.4.0) - ANSSI R7, R8, R11
#
# Ces parametres sont ajoutes a la ligne de commande du noyau via un fragment
# dans /etc/default/grub.d/. Ils ne prennent effet qu'au prochain demarrage.
#
# EN CAS DE BLOCAGE AU DEMARRAGE : au menu GRUB, appuyer sur 'e', retirer les
# parametres fautifs de la ligne commencant par "linux", puis Ctrl-X pour
# demarrer une fois. Ensuite, supprimer /etc/default/grub.d/99-secop-anssi.cfg
# et relancer update-grub.
# ---------------------------------------------------------------------------

# Socle : activation du LSM Yama (R11) et attenuations memoire (R8).
# Desactive par defaut : a n'activer qu'avec un acces console disponible.
SECOP_GRUB="no"

# Desactivation du multithreading simultane (mds=full,nosmt).
# INDISPENSABLE pour que R8 passe au vert, mais divise par deux le nombre de
# processeurs logiques. A arbitrer selon le dimensionnement de la machine.
SECOP_GRUB_NOSMT="no"

# Activation de l'IOMMU (iommu=force), requise par R7.
# Peut empecher le demarrage ou faire disparaitre des peripheriques sur
# certaines machines physiques et certains hyperviseurs.
SECOP_GRUB_IOMMU="no"

# ---------------------------------------------------------------------------
# LOT AUTHENTIFICATION PAM (version 0.5.0) - ANSSI R31, R67
#
# ZONE LA PLUS SENSIBLE DU PAQUET. Une erreur de configuration PAM peut
# empecher toute connexion, y compris en console.
#
# AVANT D'ACTIVER :
#   1. Garder une session root ouverte dans un terminal.
#   2. Activer, appliquer, puis tester une connexion dans un AUTRE terminal.
#   3. Ne fermer la session root qu'une fois la connexion confirmee.
#
# EN CAS DE BLOCAGE, depuis la session root restee ouverte :
#   secop-harden revert
# Ou, en console de secours, supprimer les fichiers
# /usr/share/pam-configs/secop-* puis relancer : pam-auth-update --package
# ---------------------------------------------------------------------------

# Qualite des mots de passe - ANSSI R31
# Risque faible : n'affecte que la DEFINITION d'un mot de passe, jamais la
# connexion. Un mot de passe deja en place continue de fonctionner.
# Necessite le paquet libpam-pwquality.
# Sur un controleur de domaine, ne concerne que les comptes LOCAUX : la
# politique du domaine reste geree par samba-tool domain passwordsettings.
SECOP_PWQUALITY="no"

# Blocage du compte apres echecs repetes - ANSSI R67
# Risque reel : affecte la CONNEXION. Parametrage retenu : 5 echecs, blocage
# de 15 minutes qui se leve tout seul, et root jamais bloque.
SECOP_FAILLOCK="no"

# ---------------------------------------------------------------------------
# LOT PARE-FEU (version 0.6.0) - ANSSI R79
#
# Jeu de regles nftables charge par un service systemd dedie. Le fichier
# /etc/nftables.conf du paquet nftables n'est jamais modifie.
#
# NE JAMAIS ACTIVER A TRAVERS UNE SESSION SSH DISTANTE SANS FILET.
# La bonne methode :
#   1. secop-harden firewall-test
#      Applique les regles 60 secondes, puis les retire automatiquement,
#      meme si la session est coupee entre-temps.
#   2. Pendant ces 60 secondes, verifier l'acces depuis une autre machine.
#   3. Si tout tient, passer SECOP_FIREWALL a "yes" et appliquer.
#
# EN CAS DE COUPURE, depuis la console de l'hyperviseur :
#   secop-harden firewall-off
# ---------------------------------------------------------------------------

SECOP_FIREWALL="no"

# Port d'administration, toujours ouvert quelle que soit la configuration.
SECOP_FIREWALL_SSH_PORT="22"

# Ports supplementaires a ouvrir, separes par des virgules.
# Exemple : SECOP_FIREWALL_TCP="80, 443, 9389"
# Le port 9389 correspond aux Active Directory Web Services.
SECOP_FIREWALL_TCP=""
SECOP_FIREWALL_UDP=""

# Rappel : le role samba-ad-dc ouvre automatiquement les flux Active
# Directory (DNS, Kerberos, LDAP, SMB, catalogue global et plage RPC
# dynamique). Les ports NetBIOS restent fermes, conformement au smb.conf
# de reference qui impose "disable netbios = yes".

# ---------------------------------------------------------------------------
# LOT FINAL (version 0.7.0) - ANSSI R10, R57
# ---------------------------------------------------------------------------

# Retrait des droits speciaux setuid et setgid - ANSSI R57
# Huit binaires restent epargnes : passwd, mount, umount, gpasswd, su, sudo,
# dbus-daemon-launch-helper et ssh-keysign. La liste est exactement celle du
# script de diagnostic.
#
# ATTENTION sur un poste graphique : pkexec, polkit-agent-helper et
# Xorg.wrap perdent leurs droits, ce qui peut empecher l'elevation de
# privileges graphique et le demarrage de X. Sans effet notable sur un
# serveur sans interface graphique.
# L'etat d'origine est sauvegarde : "secop-harden revert" le restaure.
SECOP_SUID="no"

# Verrouillage du chargement de modules noyau - ANSSI R10
# Une fois applique, plus AUCUN module ne peut etre charge jusqu'au
# redemarrage suivant, y compris pour un peripherique branche a chaud ou un
# systeme de fichiers monte plus tard.
#
# Le verrou n'est pas pose immediatement : il est arme pour le prochain
# demarrage, une fois tous les modules necessaires deja charges.
SECOP_MODULES_LOCK="no"
